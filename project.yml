name: BSide
options:
  bundleIdPrefix: com.anhile
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BSide:
    type: application
    platform: macOS
    sources:
      - path: Sources/BSide
        excludes:
          - "Resources/**"
      - path: Sources/BSide/Resources
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: B-Side
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        # The bundle ID must stay stable: WKWebsiteDataStore.default() keys the
        # cookie store on it, and the settings, the login item and the menu bar
        # icon's place go by it too. Changing it signs every user out.
        PRODUCT_BUNDLE_IDENTIFIER: com.anhile.bside
        PRODUCT_NAME: B-Side
        PRODUCT_MODULE_NAME: BSide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # B-Side's orange for system controls (Settings' toggles and tabs, a
        # sheet's default button) while the system accent is Multicolor.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
